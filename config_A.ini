; Config for CLIENT A — runs on VM-2
;
; Replace SERVER_IP / CLIENT_B_IP with the real IPs of your VMs.
; CLIENT_A's own host can stay 0.0.0.0 to listen on all interfaces.

[server]
host = SERVER_IP
port = 9000

[me]
id   = A
user = Joel
host = 0.0.0.0
port = 9101

[peer:B]
host = CLIENT_B_IP
port = 9102
